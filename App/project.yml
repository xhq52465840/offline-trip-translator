# XcodeGen：brew install xcodegen && xcodegen generate
name: TripUnderstand
options:
  developmentLanguage: zh-Hans
  bundleIdPrefix: app.tripunderstand
  deploymentTarget:
    iOS: "17.0"
packages:
  TripCore:
    path: ../TripCore
targets:
  TripUnderstand:
    type: application
    platform: iOS
    sources: [TripApp]
    dependencies:
      - package: TripCore
        product: TripCore
      - package: TripCore
        product: TripLLM
      - package: TripCore
        product: TripAppModel
    info:
      path: TripApp/Info.plist
      properties:
        CFBundleDisplayName: 离线行程理解
        CFBundleDevelopmentRegion: zh-Hans   # 系统控件（返回按钮等）显示中文（Mac run r1：显示 Back）
        CFBundleLocalizations: [zh-Hans, en]   # P7：英文界面（Localizable.xcstrings + en.lproj/InfoPlist.strings，由 scripts/i18n.py gen 生成）
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: 用来听对方说话和你说的话。只在手机上识别，不保存录音。
        NSSpeechRecognitionUsageDescription: 用来把听到的话转成文字。识别在这台手机上完成。
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: TripApp/TripUnderstand.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""   # 在 Xcode 里选你的 Team
        PRODUCT_BUNDLE_IDENTIFIER: app.tripunderstand.demo
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_LANGUAGE: zh-Hans
  TripUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TripUITests]
    dependencies:
      - target: TripUnderstand
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tripunderstand.demo.uitests
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TripUnderstand
schemes:
  TripUnderstand:
    build:
      targets:
        TripUnderstand: all
        TripUITests: [test]
    test:
      config: Debug
      targets: [TripUITests]
    run:
      config: Debug
      # 本地 StoreKit 沙盒（决策 D4，价格为提案）
      storeKitConfiguration: TripApp/Products.storekit
