# XcodeGen：brew install xcodegen && xcodegen generate
name: TripUnderstand
options:
  bundleIdPrefix: app.tripunderstand
  deploymentTarget:
    iOS: "17.0"
packages:
  TripCore:
    path: ../TripCore
targets:
  TripUnderstand:
    type: application
    platform: iOS
    sources: [TripApp]
    dependencies:
      - package: TripCore
        product: TripCore
      - package: TripCore
        product: TripLLM
      - package: TripCore
        product: TripAppModel
    info:
      path: TripApp/Info.plist
      properties:
        CFBundleDisplayName: 离线行程理解
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: 用来听对方说话和你说的中文。只在手机上识别，不保存录音。
        NSSpeechRecognitionUsageDescription: 用来把听到的话转成文字。识别在这台手机上完成。
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
